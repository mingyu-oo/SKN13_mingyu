{% extends "layouts/main_layout.html" %}
{% block contents %}
    <h1>설문 질문 등록</h1>
    <!-- action 생략 : 현재 url로 요청, form 요청, 등록 처리가 같은 url이기 때문에 생략. -->
    <form method="post">
        {% csrf_token %}
        <h2>질문</h2>
        <input type="text" name="question_text" required class="form-control">
        <h2>보기</h2>
        <div id="choice_layer">
            <input type="text" name="choice_text"required class="form-control">
        </div>
        <div class="mt-3">
            <button type="button" onclick="addChoice();"" class="btn btn-primary"">보기 추가</button>
            <button type="button" onclick="delChoice();"" class="btn btn-danger"">보기 삭제</button>
            <button type="submit" class="btn btn-primary">문제 등록</button>
        </div>
    </form>
    <script>
        function addChoice() {
            // 보기 입력 input form을 추가하는 func
            input = document.createElement("input");
            input.setAttribute("type", "text");
            input.setAttribute("name", "choice_text");
            input.setAttribute("required", true);
            input.setAttribute("class", "form-control");

            div = document.getElementById("choice_layer");
            div.append(input);
        }
        function delChoice() {
            // 보기 입력 input form이 2개 이상일 때 마지막 form을 제거하는 func
            // 하나만 있을 경우는 삭제핮 ㅣ않도록 처리
            div = document.getElementById("choice_layer")
            if (div.children.length >= 2) {
                div.removeChild(div.lastChild);
            }else {
                alert("보기가 하나면 삭제가 안되지용 ㅠㅠ")
            }
        }
    </script>
{%endblock contents%}
