<!-- 모든 page의 공통부분을 구현한 template -->
 <!DOCTYPE html>
 <html lang="ko">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

   <title>{%block title%}설문{%endblock title%}</title>
 </head>
 <body>
   <!-- 
   메뉴 : nav
   로그인 여부와 관계 없이 나오는 메뉴 : 설문 목록
   로그인 안한 상태에서 나오는 메뉴 : 회원가입, 로그인
   로그인 한 상태에서 나오는 메뉴 : 설문등록, 로그아웃, 사용자 이름(정보 조회), 설문 참여(투표)
   -->
   {# {user}}, {{user.is_authenticated} #}
   <nav class="navbar navbar-expand-sm bg-success bg-opacity-10">
      <div class="container">
         <div class="navbar-nav">
            <a href="{% url 'home' %}" class="nav-link">홈</a>
            <a href="{% url 'polls:list' %}" class="nav-link">설문목록</a>

            {% if not user.is_authenticated %}
            <a href="{% url 'account:create' %}" class="nav-link">회원가입</a>
            <a href="{% url 'account:login' %}" class="nav-link">로그인</a>
            {% endif %}

            {% if user.is_authenticated %}
            <a href="{% url 'polls:vote_create' %}" class="nav-link">설문등록</a>
            <a href="{% url 'account:detail' %}" class="nav-link" style="color: coral;" >{{user.name}}</a>
            <a href="{% url 'account:logout' %}" class="nav-link">로그아웃</a>
            {% endif %}
         </div>
      </div>
   </nav>
   <hr>
   <div class="container mt-3">
      {%block contents%}{%endblock contents%}
   </div>
 </body>
 </html>
