<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container mt-3">
            <div class="row">

            <input
                id="btn1"
                type="button"
                onclick="arrayExam()"
                value="arrayExam1"
                class="btn btn-primary col-4"
            />
            <input
                id="btn2"
                type="button"
                onclick="arrayExam2()"
                value="arrayExam2"
                class="btn btn-success col-4"
            />
            <input
                id="btn3"
                type="button"
                onclick="dateExam()"
                value="dateExam"
                class="btn btn-danger col-4"
            />
            </div>
        </div>
        <script>
            function arrayExam() {
                // 배열 생성
                let arr = [1, 2, 3, 4, "바나나", "귤", true];
                console.log(arr);
                console.log("배열 크기 : " + arr.length);

                let v1 = arr.pop();
                let v2 = arr.shift();
                console.log(v1, v2);
                console.log(arr);   // pop, shift로 삭제된 자리를 다른 value들이 채움, idx 땡겨줌.

                let v3 = arr.splice(1, 2);
                console.log(`splice(1, 2) // 자르고 삭제 : ${v3}`);
                console.log(arr);

                arr.push("마지막값");
                console.log(arr);
                arr.unshift("첫번째 값");   // 첫 째 idx에 값을 추가
                console.log(arr);
                // splice(start_idx, (대체할 값 개수), 삽입할 값들)
                arr.splice(2, 1, "삽입할 값", 1, 2, 3, 4, 5);   // 이러면 2번 idx부터 1개의 값은 대체되고 삽입할 값들이 들어감.
                console.log(arr);
            }
            function arrayExam2() {
                let arr = ["a", "b", "c", "d", "e"];
                console.log(arr);
                console.log("0, 2 idx value : ", arr[0], arr[2]);

                arr[1] = "가";
                console.log(arr);
                arr[7] = "나";      // idx 건너뛰고 추가
                console.log(arr);
                console.log(arr[5])
                console.log(arr[6])

                for (i = 0; i < arr.length; i++) {
                    console.log(arr[i]);
                }
                console.log("for in statement")
                for (i in arr) {
                    console.log(i, arr[i]);
                }
            }

            function dateExam() {
                let today = new Date();     // 실행 시점의 요일/월/일/년도/시/분/초/표준시 가지는 Date 객체
                // console.log(today);
                // let today_str = dateToString(today);
                // console.log(today_str);
                let dt = new Date(2010, 10, 1, 17, 49, 50);
                console.log(dateToString(dt));  // 수정 필요
            }
            
            function dateToString(dt) {
                let year = dt.getFullYear();    // 년도 4자리

                let month = dt.getMonth() + 1;  // 0 ~ 11 출력이라 +1
                if (month < 10) month = "0" + month;

                let date = dt.getDate();        // 일
                if (date < 10) date = "0" + date;

                let hour = dt.getHours();       // 시간
                if (hour < 10) hour = "0" + hour;

                let minute = dt.getMinutes();   // 분
                if (minute < 10) minute = "0" + minute;

                let second = dt.getSeconds();   // 초
                if (second < 10) second = "0" + second;

                return `${year}/${month}/${date} ${hour}:${minute}:${second}`;
            }
        </script>
    </body>
</html>
