<!DOCTYPE html>

        <title>Document</title>

    <body>
        <h2>Javascript Object 예제</h2>
        <script>
            const person = {    // const는 person이지 안의 instance들은 const가 아님.
                name: "홍길동",
                age: 20,
                isMarriage: false,
                "job name": "회사원",
                hobby: ["게임", "스포츠"],
                go: function (place) {
                    alert(place + "에 간다.");
                },
                getInfo: function () {
                    // method에서 다른 property들(instance 변수 / instance method)에 접근
                    // this.변수명, this.method()
                    // this : mothod를 소유한 객체를 가르킴. (~= self)
                    info = `이름: ${this.name}, 나이: ${this.age}`;
                    return info;
                },
            };

            // console.log(person)

            // for (let key in person){

            console.log("=========구조분해할당")

            let [v1, v2, v3, v4, v5, v6=0] = arr
            console.log(v1, v2, v3, v4, v5, v6)
            let {name, age} = person
            console.log(name, age)

            let {name:p_name, age:p_age, hobby:p_hobby, hobby} = person
